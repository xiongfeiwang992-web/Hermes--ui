<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Hermes UI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var THEMES = { hermes: 1, claw: 1, knot: 1, dash: 1, custom: 1 };
        var MODES = { system: 1, light: 1, dark: 1 };
        try {
          var raw = localStorage.getItem("hermes.ui.settings.v1");
          if (!raw) return;
          var s = JSON.parse(raw);
          var theme = THEMES[s.theme] ? s.theme : "hermes";
          var mode = MODES[s.themeMode] ? s.themeMode : "system";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var resolved =
            theme === "hermes"
              ? mode === "light"
                ? "hermes-light"
                : "hermes"
              : theme === "knot"
                ? mode === "light"
                  ? "openknot-light"
                  : "openknot"
                : theme === "dash"
                  ? mode === "light"
                    ? "dash-light"
                    : "dash"
                  : mode === "light"
                    ? "light"
                    : "dark";
          var resolvedMode = resolved.includes("light") ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute("data-theme-mode", resolvedMode);
          document.documentElement.setAttribute("data-theme-resolved", resolvedMode);
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        min-height: 100%;
      }
      html {
        background: #0a0e1a;
        color-scheme: dark;
      }
      html[data-theme-mode="light"] {
        background: #f5f0e5;
        color-scheme: light;
      }
      html[data-theme="hermes-light"] {
        background: #f5f0e5;
      }
      html[data-theme="openknot"] {
        background: #080808;
      }
      html[data-theme="openknot-light"] {
        background: #f9f9fb;
      }
      html[data-theme="dash"] {
        background: #1a1210;
      }
      html[data-theme="dash-light"] {
        background: #f7f2ec;
      }
      body {
        margin: 0;
        background: inherit;
      }
    </style>
    <link rel="stylesheet" href="../src/styles/base.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
  </head>
  <body>
    <div class="hermes-app">
      <aside class="hermes-sidebar">
        <div class="hermes-brand">
          <div class="hermes-brand-mark">H</div>
          <div class="hermes-brand-text">
            <strong>Hermes</strong>
            <span>Agent UI</span>
          </div>
        </div>

        <div class="hermes-session-list">
          <button class="hermes-session active" type="button">
            <div class="hermes-session-title">默认会话</div>
            <div class="hermes-session-preview">主题系统已更新，支持持久化设置。</div>
          </button>
          <button class="hermes-session" type="button">
            <div class="hermes-session-title">代码审查</div>
            <div class="hermes-session-preview">帮我检查 theme-manager 的实现。</div>
          </button>
          <button class="hermes-session" type="button">
            <div class="hermes-session-title">部署计划</div>
            <div class="hermes-session-preview">整理 Hermes UI 发布步骤。</div>
          </button>
        </div>
      </aside>

      <main class="hermes-main">
        <header class="hermes-topbar">
          <div>
            <h1>默认会话</h1>
            <p>Hermes UI · 基于 OpenClaw 主题体系</p>
          </div>
          <div class="hermes-meta" id="resolved-theme">loading…</div>
        </header>

        <section class="hermes-chat">
          <article class="hermes-msg">
            <div class="hermes-msg-label">Hermes</div>
            <div class="hermes-msg-body">
              你好，我已更新 Hermes UI：设置会写入 localStorage，刷新页面不会闪烁，System
              模式也会跟随系统深浅色切换。
            </div>
          </article>
          <article class="hermes-msg user">
            <div class="hermes-msg-label">你</div>
            <div class="hermes-msg-body">更新一下 Hermes。</div>
          </article>
          <article class="hermes-msg">
            <div class="hermes-msg-label">Hermes</div>
            <div class="hermes-msg-body">
              你可以在下方切换 Theme 和 Mode。当前默认主题是 Hermes 金色，也可以切到 Claw、Knot、Dash。
            </div>
          </article>
        </section>

        <footer class="hermes-composer">
          <div class="hermes-composer-box">
            <textarea placeholder="输入消息，或切换主题预览效果…" aria-label="Message"></textarea>
            <div class="hermes-composer-actions">
              <div class="hermes-chip-row">
                <div class="hermes-chip-row" id="theme-chips"></div>
                <div class="hermes-chip-row" id="mode-chips"></div>
              </div>
              <button class="hermes-btn" type="button">发送</button>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <script type="module">
      import { createThemeManager } from "../src/app/theme-manager.ts";
      import { THEME_MODE_OPTIONS, THEME_OPTIONS } from "../src/app/theme.ts";

      const themeManager = createThemeManager();

      function renderMeta() {
        const { theme, themeMode } = themeManager.settings;
        document.getElementById("resolved-theme").textContent =
          `${themeManager.resolved} · theme=${theme} · mode=${themeMode}`;
      }

      function renderChips() {
        document.querySelectorAll("[data-theme-chip]").forEach((chip) => {
          chip.classList.toggle("active", chip.dataset.themeChip === themeManager.settings.theme);
        });
        document.querySelectorAll("[data-mode-chip]").forEach((chip) => {
          chip.classList.toggle("active", chip.dataset.modeChip === themeManager.settings.themeMode);
        });
      }

      function render() {
        renderMeta();
        renderChips();
      }

      const themeRow = document.getElementById("theme-chips");
      for (const option of THEME_OPTIONS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hermes-chip";
        button.dataset.themeChip = option.id;
        button.textContent = option.label;
        button.title = option.description;
        button.addEventListener("click", () => {
          themeManager.setTheme(option.id, button);
          render();
        });
        themeRow.appendChild(button);
      }

      const modeRow = document.getElementById("mode-chips");
      for (const option of THEME_MODE_OPTIONS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hermes-chip";
        button.dataset.modeChip = option.id;
        button.textContent = option.label;
        button.addEventListener("click", () => {
          themeManager.setThemeMode(option.id, button);
          render();
        });
        modeRow.appendChild(button);
      }

      themeManager.subscribe(render);
      render();
    </script>
  </body>
</html>
